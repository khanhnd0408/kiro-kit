<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crewctl map</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --line: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --shadow: rgba(11,11,11,0.10);
  --c-root: #2a78d6; --c-group: #6250d6; --c-folder: #1baf7a; --c-cmd: #2a78d6; --c-opt: #eb6834; --c-glob: #898781;
  --edge: #c3c2b7; --edge-on: #eb6834; --dot: rgba(11,11,11,0.06);
  --good: #0ca30c; --warning: #b98000; --serious: #c4572f; --critical: #d03b3b;
  --code-cmd: #1c5cab; --code-opt: #a84a17; --code-val: #0b0b0b; --code-missing: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --line: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --shadow: rgba(0,0,0,0.5);
    --c-root: #3987e5; --c-group: #9085e9; --c-folder: #199e70; --c-cmd: #3987e5; --c-opt: #d95926; --c-glob: #898781;
    --edge: #383835; --edge-on: #d95926; --dot: rgba(255,255,255,0.05);
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e66767;
    --code-cmd: #86b6ef; --code-opt: #ec835a; --code-val: #f0efec; --code-missing: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --line: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --shadow: rgba(0,0,0,0.5);
  --c-root: #3987e5; --c-group: #9085e9; --c-folder: #199e70; --c-cmd: #3987e5; --c-opt: #d95926; --c-glob: #898781;
  --edge: #383835; --edge-on: #d95926; --dot: rgba(255,255,255,0.05);
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e66767;
  --code-cmd: #86b6ef; --code-opt: #ec835a; --code-val: #f0efec; --code-missing: #e66767;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
button, input { font: inherit; color: inherit; }

/* top bar */
.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border);
  background: var(--surface); z-index: 5; }
.brand { font-weight: 600; white-space: nowrap; }
.brand small { color: var(--muted); font-weight: 400; margin-left: 4px; }
.crumbs { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
.crumbs button { border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; color: var(--ink-2); }
.crumbs button:hover { background: var(--surface-2); color: var(--ink); }
.crumbs button[aria-current] { color: var(--ink); font-weight: 600; }
.crumbs .sep { color: var(--muted); }
.search { position: relative; }
.search input { width: clamp(140px, 20vw, 260px); padding: 7px 10px 7px 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--page); }
.search::before { content: "⌕"; position: absolute; left: 10px; top: 6px; color: var(--muted); }
.results { position: absolute; top: 40px; right: 0; width: 380px; max-height: 60vh; overflow: auto; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 28px var(--shadow); padding: 4px; display: none; }
.results.open { display: block; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.results button:hover, .results button.active { background: var(--surface-2); }
.results b { font-weight: 600; }
.results span { display: block; color: var(--ink-2); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 10px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.ghost { border: 1px solid var(--border); background: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: var(--ink-2); }
.ghost:hover { color: var(--ink); background: var(--surface-2); }

/* the stage */
.stage { position: relative; overflow: hidden;
  background-image: radial-gradient(var(--dot) 1px, transparent 1.4px); background-size: 22px 22px; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; stroke-linecap: round; }
.edge.parent { stroke-width: 1.2; opacity: .3; }
.edge.on { stroke: var(--edge-on); stroke-width: 2; }
.edge.pulse { stroke: var(--edge-on); stroke-width: 2.5; stroke-dasharray: 2 14; animation: flow 1.1s linear infinite; opacity: .9; }
@keyframes flow { to { stroke-dashoffset: -16; } }
.tip { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); color: var(--muted); font-size: 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; white-space: nowrap; z-index: 3; }

.node { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) scale(1);
  transition: left .45s cubic-bezier(.2,.8,.2,1), top .45s cubic-bezier(.2,.8,.2,1), opacity .3s, transform .45s; z-index: 2; }
.node.hidden { opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(.4); }
/* the parent (where you came from): pushed into the background, sharp again on hover so it is easy to go back */
.node.dim { opacity: .42; filter: blur(2.2px) saturate(.45); transition: left .45s cubic-bezier(.2,.8,.2,1), top .45s cubic-bezier(.2,.8,.2,1), opacity .3s, transform .45s, filter .25s; }
.node.dim:hover, .node.dim:focus-within { opacity: 1; filter: none; }
/* round nodes: root, groups, folders, commands */
.orb { --c: var(--c-cmd); width: 104px; height: 104px; border-radius: 50%; border: 2px solid var(--c); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px;
  cursor: pointer; box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 10%, transparent), 0 6px 18px var(--shadow); }
.orb:hover { box-shadow: 0 0 0 9px color-mix(in srgb, var(--c) 18%, transparent), 0 6px 18px var(--shadow); }
.orb:focus-visible, .pill:focus-within { outline: 2px solid var(--c); outline-offset: 4px; }
.orb .name { font-weight: 600; line-height: 1.15; word-break: break-word; }
.orb .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
.orb.root { --c: var(--c-root); width: 132px; height: 132px; }
.orb.root .name { font-size: 20px; }
.orb.group { --c: var(--c-group); width: 116px; height: 116px; }
.orb.folder { --c: var(--c-folder); }
.orb.glob { --c: var(--c-glob); width: 92px; height: 92px; }
/* the active node: bigger, a thicker ring, a tinted fill and a slow breathing halo */
.node.focus { z-index: 3; }
.node.focus .orb { transform: scale(1.3); border-width: 3px;
  background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--c) 22%, var(--surface)), color-mix(in srgb, var(--c) 8%, var(--surface)) 70%);
  box-shadow: 0 0 0 7px color-mix(in srgb, var(--c) 22%, transparent), 0 0 0 16px color-mix(in srgb, var(--c) 9%, transparent),
              0 0 56px color-mix(in srgb, var(--c) 45%, transparent), 0 10px 28px var(--shadow); }
.node.focus .orb .name { font-size: 16px; }
.node.focus .orb.root .name { font-size: 22px; }
.node.focus .orb::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px solid var(--c);
  opacity: 0; animation: breathe 2.6s ease-out infinite; pointer-events: none; }
@keyframes breathe { 0% { transform: scale(.92); opacity: .55; } 100% { transform: scale(1.22); opacity: 0; } }
.orb { position: relative; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; letter-spacing: .02em;
  padding: 1px 6px; border-radius: 999px; border: 1px solid currentColor; margin-top: 4px; white-space: nowrap; }
.badge.read { color: var(--good); } .badge.write { color: var(--warning); } .badge.change { color: var(--serious); }

/* option nodes: a pill with the input in place of the name */
.pill { --c: var(--c-opt); position: relative; width: 214px; padding: 9px 12px 10px; border-radius: 16px; background: var(--surface);
  border: 1.5px solid color-mix(in srgb, var(--c) 55%, var(--border)); box-shadow: 0 6px 18px var(--shadow); }
.pill.on { border-color: var(--c); box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 14%, transparent), 0 6px 18px var(--shadow); }
.pill.required { border-style: dashed; }
.pill.required.filled { border-style: solid; }
.pill .flag { font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink-2); display: block; margin-bottom: 6px; }
.pill .req { color: var(--critical); font: 600 10px/1 system-ui, sans-serif; margin-left: 6px; text-transform: uppercase; letter-spacing: .03em; }
.pill input[type=text] { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; background: var(--page);
  font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.pill input[type=text]:focus { outline: none; border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 20%, transparent); }
.toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: none;
  padding: 0; cursor: pointer; text-align: left; }
.toggle .flag { margin: 0; }
.switch { width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface);
  box-shadow: 0 1px 2px var(--shadow); transition: left .2s; }
.pill.on .switch { background: var(--c); } .pill.on .switch::after { left: 17px; }
.choices { display: flex; flex-wrap: wrap; gap: 4px; }
.choices button { border: 1px solid var(--border); background: var(--page); border-radius: 999px; padding: 3px 9px; cursor: pointer;
  font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink-2); }
.choices button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.hint-btn { position: absolute; top: -11px; right: 14px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink-2); font: 600 12px/20px system-ui, sans-serif; cursor: pointer; padding: 0; }
.hint-btn:hover, .hint-btn[aria-expanded="true"] { background: var(--c); color: #fff; border-color: var(--c); }
.popover { position: absolute; z-index: 10; width: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 12px 32px var(--shadow); padding: 12px 14px; display: none; }
.popover.open { display: block; }
.popover h3 { margin: 0 0 6px; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.popover p { margin: 0 0 6px; color: var(--ink-2); font-size: 13px; }
.popover p.effect { color: var(--ink); }
.popover .close { position: absolute; top: 6px; right: 8px; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; }

/* bottom: what it does + the command + copy */
/* the command bar: a floating glass panel (Spotlight-like) that grows when the command wraps */
:root { --glass: rgba(252,252,251,0.62); --glass-edge: rgba(255,255,255,0.70); --glass-line: rgba(11,11,11,0.08);
  --glass-shadow: 0 18px 50px rgba(11,11,11,0.18), 0 2px 6px rgba(11,11,11,0.06); --glass-inner: inset 0 1px 0 rgba(255,255,255,0.75); }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  --glass: rgba(30,30,28,0.55); --glass-edge: rgba(255,255,255,0.14); --glass-line: rgba(255,255,255,0.08);
  --glass-shadow: 0 18px 50px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.35); --glass-inner: inset 0 1px 0 rgba(255,255,255,0.08); } }
:root[data-theme="dark"] { --glass: rgba(30,30,28,0.55); --glass-edge: rgba(255,255,255,0.14); --glass-line: rgba(255,255,255,0.08);
  --glass-shadow: 0 18px 50px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.35); --glass-inner: inset 0 1px 0 rgba(255,255,255,0.08); }
.bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(980px, calc(100% - 32px)); z-index: 6;
  background: var(--glass); -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%);
  border: 1px solid var(--glass-edge); border-radius: 22px; box-shadow: var(--glass-shadow), var(--glass-inner); padding: 8px 8px 8px 16px; }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .bar { background: var(--surface); } }
.cmdrow { display: flex; align-items: flex-start; gap: 10px; }
.cmdrow .lead { flex: none; padding-top: 9px; color: var(--muted); font: 600 15px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; user-select: none; }
.grow { flex: 1; min-width: 0; overflow: hidden; transition: height .28s cubic-bezier(.2,.8,.2,1); }
.cmdbox { padding: 7px 2px; font: 15px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap;
  overflow-wrap: anywhere; max-height: 34vh; overflow-y: auto; }
.cmdbox span { white-space: nowrap; }                       /* wrap between tokens, never inside --copy-from */
.cmdbox span.long, .cmdbox .chip.long { white-space: normal; }       /* a long value may wrap... */
.cmdbox .chip.long .v { white-space: normal; overflow-wrap: anywhere; }  /* ...inside itself; --copy-from never does */
.chip { position: relative; border-radius: 7px; padding: 1px 3px; margin: 0 -3px; cursor: pointer; transition: background .15s; }
.chip:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
/* The x: a zero-width button in the text flow (so the line's text stays one clean line), with its circle drawn on the
   chip's corner. Clicking the circle clicks the button. */
.chip .x { position: relative; display: inline; cursor: pointer; user-select: none; }
                     /* an empty inline: no width, no line break in the text, and its box lines up with the chip's text */
.chip .x::before { content: "×"; position: absolute; top: -10px; left: -5px; width: 17px; height: 17px; border-radius: 50%;
  background: var(--ink-2); color: var(--surface); border: 1px solid var(--glass-edge); font: 700 11px/15px system-ui, sans-serif;
  text-align: center; opacity: 0; transform: scale(.7); transition: opacity .15s, transform .15s; z-index: 1; }
.chip:hover .x::before, .chip .x:focus-visible::before { opacity: 1; transform: scale(1); }
.chip .x:hover::before { background: var(--critical); color: #fff; }
.chip .x:focus-visible { outline: none; }
.chip .x:focus-visible::before { outline: 2px solid var(--c-cmd); outline-offset: 1px; }
@media (hover: none) { .chip .x::before { opacity: .7; transform: scale(1); } }
.chip.missing { outline: 1px dashed var(--code-missing); outline-offset: -1px; }
.clearall { border: 1px solid var(--glass-line); background: transparent; color: var(--ink-2); height: 36px; padding: 0 12px; border-radius: 14px; cursor: pointer; }
.clearall:hover:not(:disabled) { color: var(--ink); background: color-mix(in srgb, var(--ink) 6%, transparent); }
.clearall:disabled { opacity: .4; cursor: default; }
.toast { position: fixed; left: 50%; transform: translate(-50%, 12px); bottom: 130px; z-index: 7; display: flex; gap: 14px; align-items: center;
  background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--glass-edge); border-radius: 999px; box-shadow: var(--glass-shadow); padding: 8px 10px 8px 16px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.toast button { border: 0; background: var(--c-cmd); color: #fff; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-weight: 600; }
.field { position: relative; }
.field input { padding-right: 28px !important; }
.field .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; border-radius: 50%; border: 0;
  background: color-mix(in srgb, var(--ink) 14%, transparent); color: var(--ink-2); font: 600 12px/18px system-ui, sans-serif; padding: 0; cursor: pointer; }
.field .clear::before { content: "×"; }
.field .clear:hover { background: var(--critical); color: #fff; }
.pill:not(.filled) .clear { display: none; }
.pill.flash { animation: flash .9s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 60%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
.cmdbox .w { color: var(--code-cmd); font-weight: 600; }
.cmdbox .o { color: var(--code-opt); }
.cmdbox .v { color: var(--code-val); }
.cmdbox .m { color: var(--code-missing); font-style: italic; }
.side { flex: none; display: flex; align-items: center; gap: 8px; }
.side .badge { margin: 0; }
.copy { border: 0; background: var(--c-cmd); color: #fff; height: 36px; padding: 0 16px; border-radius: 14px; cursor: pointer; font-weight: 600;
  min-width: 92px; box-shadow: 0 4px 14px color-mix(in srgb, var(--c-cmd) 35%, transparent); transition: background .2s, transform .1s; }
.copy:active { transform: scale(.97); }
.copy:disabled { opacity: .45; cursor: default; box-shadow: none; }
.copy.done { background: var(--good); }
.foot { display: flex; gap: 12px; align-items: baseline; border-top: 1px solid var(--glass-line); margin: 6px 8px 0 0; padding: 7px 0 2px; }
.effects { flex: 1; min-width: 0; color: var(--ink-2); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; }
.effects b { color: var(--ink); font-weight: 600; }
.effects .kept { color: var(--muted); }
/* no hover-expand here: the panel grows upward, so it would pull the chips away from the pointer */
.warnline { flex: none; color: var(--critical); font-size: 12px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .node, .orb { transition: none !important; } .edge.pulse { animation: none; }
  .node.focus .orb::after { animation: none; opacity: .35; transform: scale(1.06); } }
@media (max-width: 1000px) { .brand small { display: none; } .seg button { padding: 6px 7px; } .top { gap: 8px; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">crewctl map<small id="ver"></small></div>
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <div class="search"><input id="q" type="text" placeholder="Find a command…  ( / )" aria-label="Find a command" autocomplete="off">
    <div class="results" id="results" role="listbox"></div></div>
  <div class="seg" role="group" aria-label="Theme">
    <button data-theme-set="auto" aria-pressed="true">Auto</button><button data-theme-set="light" aria-pressed="false">Light</button><button data-theme-set="dark" aria-pressed="false">Dark</button>
  </div>
  <button class="ghost" id="reset" title="Clear every choice">Reset</button>
</header>
<main class="stage" id="stage">
  <svg id="edges" aria-hidden="true"></svg>
  <div class="tip" id="tip">Click a node to focus it · Esc goes back to where you were · ⌫ removes the last option · ⌘Z / Ctrl+Z undoes · ? explains</div>
  <div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastAction">Undo</button></div>
  <div class="popover" id="popover" role="dialog"><button class="close" aria-label="Close">×</button><div id="popbody"></div></div>
</main>
<footer class="bar" id="bar">
  <div class="cmdrow">
    <span class="lead" aria-hidden="true">$</span>
    <div class="grow" id="grow"><div class="cmdbox" id="cmd" aria-live="polite"></div></div>
    <div class="side"><span id="impact"></span><button class="clearall" id="clear" title="Remove every option of this command (⌘Z brings it back)">Clear</button><button class="copy" id="copy">Copy</button></div>
  </div>
  <div class="foot"><div class="effects" id="effects"></div><div class="warnline" id="warn"></div></div>
</footer>
<script>
const DATA = /*DATA*/null;

// CORE-START: pure functions, also run by the tests against crewctl's own command builder
function shellQuote(text) {
  text = String(text);
  if (text === "") return "''";
  if (/^[A-Za-z0-9_@%+=:,./-]+$/.test(text)) return text;
  return "'" + text.replace(/'/g, "'\"'\"'") + "'";
}
function splitList(text) {
  return String(text).split(/[\s,]+/).filter(Boolean);
}
// The same order as crewctl guide: global options, command words, the preset action, positionals, then options.
// values: {dest: true | "text"}; multi values are a "a, b" string. Returns [{t: token, k: kind}] with kind
// w (command word), o (option), v (value), m (missing required value).
function buildTokens(command, values, globals, globalValues) {
  const out = [];
  for (const arg of globals) {
    const value = globalValues[arg.dest];
    if (value === undefined || value === "" || value === false) continue;
    out.push({t: arg.flags[arg.flags.length - 1], k: "o", d: arg.dest, g: true});
    if (arg.kind !== "flag") out.push({t: String(value), k: "v", d: arg.dest, g: true});           // --verbose is a switch: no value after it
  }
  for (const part of command.parts) out.push({t: part, k: "w"});

  const chosen = c.args.filter(a => values[a.dest] !== undefined && !a.positional)
    .map(a => `<b>${esc(a.flags[a.flags.length - 1])}</b>: ${esc(a.effect || a.help)}`);
  effects.innerHTML = `<b>${esc(c.path.join(" "))}</b>: ${esc(c.effect)}` + (chosen.length ? " &nbsp;·&nbsp; " + chosen.join(" &nbsp;·&nbsp; ") : "");
  effects.title = effects.textContent;                            // the full text, when two lines are not enough
  const missing = tokens.filter(t => t.k === "m").map(t => t.t);
  warn.textContent = missing.length ? "Still to fill in: " + missing.join(", ") : "";
  copy.disabled = false;
  copy.dataset.text = commandLine(tokens);
  fitBar();
}
// Clicking a chip focuses the option's node and its input.
function editOption(cmdId, key) {
  const node = optionNode(cmdId, key);
  if (!node) return;
  focusNode(node.global ? cmdId + "|@globals" : cmdId);
  setTimeout(() => {
    const el = els[node.id], target = el.querySelector("input, .toggle, [data-choice]");
    if (target) target.focus();
    el.querySelector(".pill").classList.add("flash");
    setTimeout(() => el.querySelector(".pill").classList.remove("flash"), 900);
  }, 480);
}
// Grow (or shrink) the glass panel to the wrapped command, smoothly; the map re-centres above it.
let barHeight = 0;
function fitBar() {
  const grow = document.getElementById("grow"), box = document.getElementById("cmd");
  grow.style.height = box.offsetHeight + "px";                 // the text's own height, capped by its max-height
  const h = document.getElementById("bar").offsetHeight;
  if (Math.abs(h - barHeight) > 2) { barHeight = h; layout(); }
}

// hints ---------------------------------------------------------------------------------------------------------
const popover = document.getElementById("popover");
let hintFor = null;
function openHint(node, button) {
  if (hintFor === node.id) { closeHint(); return; }
  closeHint();
  hintFor = node.id;
  button.setAttribute("aria-expanded", "true");
  const arg = node.arg;
  const lines = [`<h3>${esc(flagLabel(arg))}</h3>`];
  if (arg.help) lines.push(`<p>${esc(arg.help)}</p>`);
  if (arg.effect && arg.effect !== arg.help) lines.push(`<p class="effect">${esc(arg.effect)}</p>`);
  if (arg.choices.length) lines.push(`<p>One of: ${arg.choices.map(esc).join(", ")}</p>`);
  if (arg.kind === "multi") lines.push(`<p>Several values: separate them with commas or spaces.</p>`);
  if (arg.required) lines.push(`<p><b>Required.</b></p>`);
  if (node.global) lines.push(`<p>A global option: it goes before the command and applies to every command.</p>`);
  document.getElementById("popbody").innerHTML = lines.join("");
  popover.classList.add("open");
  const box = button.closest(".pill").getBoundingClientRect(), s = stage.getBoundingClientRect();
  const left = Math.min(Math.max(8, box.left - s.left + box.width / 2 - 150), s.width - 308);
  const below = box.top - s.top + box.height / 2 < s.height / 2;
  popover.style.left = left + "px";
  popover.style.top = (below ? box.bottom - s.top + 12 : Math.max(8, box.top - s.top - popover.offsetHeight - 22)) + "px";
}
function closeHint() {
  if (!hintFor) return;
  const btn = els[hintFor] && els[hintFor].querySelector(".hint-btn");
  if (btn) btn.setAttribute("aria-expanded", "false");
  hintFor = null;
  popover.classList.remove("open");
}
popover.querySelector(".close").addEventListener("click", closeHint);
document.addEventListener("click", e => { if (hintFor && !popover.contains(e.target) && !e.target.classList.contains("hint-btn")) closeHint(); });

// search --------------------------------------------------------------------------------------------------------
const q = document.getElementById("q"), results = document.getElementById("results");
new ResizeObserver(() => fitBar()).observe(document.getElementById("cmd"));
let active = 0, found = [];
function search(text) {
  const words = text.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  return Object.values(commandsById).map(c => {
    const hay = (c.path.join(" ") + " " + c.words + " " + c.effect).toLowerCase();
    const score = words.reduce((s, w) => s + (c.path.join(" ").includes(w) ? 3 : hay.includes(w) ? 1 : 0), 0);
    return {c, score};
  }).filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 8);
}
function showResults() {
  found = search(q.value); active = 0;
  results.innerHTML = found.map((r, i) => `<button data-i="${i}" class="${i === active ? "active" : ""}"><b>crewctl ${esc(r.c.path.join(" "))}</b><span>${esc(r.c.effect)}</span></button>`).join("");
  results.classList.toggle("open", found.length > 0);
  results.querySelectorAll("button").forEach(b => b.addEventListener("click", () => pick(+b.dataset.i)));
}
function pick(i) { const r = found[i]; if (!r) return; results.classList.remove("open"); q.value = ""; q.blur(); focusNode("c:" + r.c.path.join(" ")); }
q.addEventListener("input", showResults);
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); active = (active + (e.key === "ArrowDown" ? 1 : found.length - 1)) % Math.max(found.length, 1);
    results.querySelectorAll("button").forEach((b, i) => b.classList.toggle("active", i === active));
  } else if (e.key === "Enter") pick(active);
  else if (e.key === "Escape") { e.stopPropagation(); results.classList.remove("open"); q.blur(); }   // closes the search only, never navigates
});

// theme, copy, keys, reset, deep links ----------------------------------------------------------------------------
function setTheme(mode) {
  if (mode === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", mode);
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === mode)));
  try { localStorage.setItem("crewctl-map-theme", mode); } catch (e) {}
}
document.querySelectorAll("[data-theme-set]").forEach(b => b.addEventListener("click", () => setTheme(b.dataset.themeSet)));
const copy = document.getElementById("copy");
copy.addEventListener("click", async () => {
  const text = copy.dataset.text || "";
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e2) {} ta.remove();
  }
  copy.textContent = ok ? "Copied ✓" : "Select & copy"; copy.classList.toggle("done", ok);
  setTimeout(() => { copy.textContent = "Copy"; copy.classList.remove("done"); }, 1600);
});
document.addEventListener("keydown", e => {
  const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (e.key === "Escape") {                     // one press: close the hint if one is open, otherwise go back (leaving any box)
    if (hintFor) closeHint();
    else { if (typing) document.activeElement.blur(); goBack(); }
  }
  else if (e.key === "/" && !typing) { e.preventDefault(); q.focus(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "y" && !typing) { e.preventDefault(); redo(); }
  else if (e.key === "Backspace" && !typing) { e.preventDefault(); removeLast(); }
});
document.getElementById("reset").addEventListener("click", () => {
  remember(null);
  state.values = {}; state.globals = {}; Object.keys(order).forEach(k => delete order[k]);
  Object.keys(nodes).forEach(refreshNode); state.trail = []; focusNode("root", true);
  toast("Everything cleared");
});
document.getElementById("clear").addEventListener("click", clearCommand);
function saveHash() {
  const params = new URLSearchParams();
  params.set("at", state.focus);
  const cmdId = cmdOf(state.focus);
  if (cmdId) for (const [k, v] of Object.entries(valuesFor(cmdId))) params.set("v." + k, v === true ? "1" : v);
  for (const [k, v] of Object.entries(state.globals)) params.set("g." + k, v === true ? "1" : v);
  history.replaceState(null, "", "#" + params.toString());
}
function loadHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  const at = params.get("at");
  if (!at || !nodes[at]) return;
  const cmdId = cmdOf(at);
  for (const [k, v] of params) {
    if (k.startsWith("v.") && cmdId) {
      const arg = commandsById[cmdId].args.find(a => a.dest === k.slice(2));
      if (arg) valuesFor(cmdId)[arg.dest] = arg.kind === "flag" ? v === "1" : v;
    } else if (k.startsWith("g.")) {
      const arg = DATA.globals.find(a => a.dest === k.slice(2));
      if (arg) state.globals[arg.dest] = arg.kind === "flag" ? v === "1" : v;
    }
  }
  state.focus = at;
  if (cmdId) {
    order[cmdId] = Object.keys(valuesFor(cmdId)).concat(Object.keys(state.globals).map(k => "@" + k));   // Backspace removes the link's last value first
  }
}

// start -------------------------------------------------------------------------------------------------------------
document.getElementById("ver").textContent = "for crewctl " + DATA.version;
buildTree();
Object.values(nodes).forEach(makeNode);
let saved = "auto";
try { saved = localStorage.getItem("crewctl-map-theme") || "auto"; } catch (e) {}
const forced = new URLSearchParams(location.hash.slice(1)).get("theme");
setTheme(forced || saved);
loadHash();
Object.keys(nodes).forEach(refreshNode);
layout(); render();
window.addEventListener("resize", () => layout());
window.addEventListener("hashchange", () => {                    // a link pasted into an open tab
  state.values = {}; state.globals = {}; state.focus = "root"; state.trail = [];
  Object.keys(order).forEach(k => delete order[k]); undoLog.undo = []; undoLog.redo = [];
  const theme = new URLSearchParams(location.hash.slice(1)).get("theme");
  if (theme) setTheme(theme);
  loadHash(); Object.keys(nodes).forEach(refreshNode); closeHint(); layout(); render();
});
setTimeout(() => { document.getElementById("tip").style.opacity = "0.75"; }, 4000);
</script>
</body>
