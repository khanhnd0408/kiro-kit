# A local backend to try `crewctl usage push` and the dashboard: an OpenTelemetry Collector in front of
# VictoriaMetrics (metrics) and VictoriaLogs (logs), and Grafana. For trying things out: no auth, and every port
# listens on 127.0.0.1 only. Data is kept in named volumes until `docker compose down -v`.
#
#   docker compose up -d
#   usage.json:  "endpoint": "http://localhost:4318"            (through the collector)
#   Grafana:     http://localhost:3000  (admin / admin), dashboard "Kiro Crew usage"
#
# Grafana downloads the VictoriaLogs plugin on its first start (internet needed once); until it finishes, about a
# minute, the log panels show an error. Reload the dashboard then.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"   # OTLP/HTTP: what crewctl sends to
    depends_on: [victoriametrics, victorialogs]

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    command: ["-storageDataPath=/storage", "-retentionPeriod=90d"]
    volumes:
      - vmdata:/storage
    ports:
      - "127.0.0.1:8428:8428"   # PromQL API and OTLP metrics (/opentelemetry/v1/metrics)

  victorialogs:
    image: victoriametrics/victoria-logs:latest
    command: ["-storageDataPath=/storage", "-retentionPeriod=90d"]
    volumes:
      - vldata:/storage
    ports:
      - "127.0.0.1:9428:9428"   # LogsQL API and OTLP logs (/insert/opentelemetry/v1/logs)

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PLUGINS_PREINSTALL: victoriametrics-logs-datasource
    volumes:
      - grafanadata:/var/lib/grafana            # keeps the plugin, so later starts need no download
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [victoriametrics, victorialogs]

volumes:
  vmdata:
  vldata:
  grafanadata:
